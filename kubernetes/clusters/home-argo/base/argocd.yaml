---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      releaseName: argocd
    path: kubernetes/clusters/home-argo
    repoURL: git@git.sr.ht:~pfriedrich/home-ops
    targetRevision: main
