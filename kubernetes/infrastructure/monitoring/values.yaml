k8s-monitoring:
  cluster:
    name: internal-paulfriedrich-me-prod

  destinations:
    prometheus:
      type: prometheus
      url: http://monitoring.internal.paulfriedrich.me:9090/api/v1/write
    loki:
      type: loki
      url: http://monitoring.internal.paulfriedrich.me:3100/loki/api/v1/push

  collectors:
    alloy-metrics:
      presets: [small, clustered, statefulset]
    alloy-logs:
      presets: [small, filesystem-log-reader, daemonset]
    alloy-singleton:
      presets: [small, deployment]

  clusterMetrics:
    enabled: true
    collector: alloy-metrics
    controlPlane:
      enabled: true
    kubeProxy:
      enabled: false

  hostMetrics:
    enabled: true
    collector: alloy-metrics
    linuxHosts:
      enabled: true
      metricsTuning:
        useIntegrationAllowList: true

  clusterEvents:
    enabled: true
    collector: alloy-singleton

  podLogsViaLoki:
    enabled: true
    collector: alloy-logs
    extraLogProcessingStages: |
      // cert-manager uses klog's one-letter severity prefix rather than a level field.
      stage.match {
        selector = "{service_name=\"cert-manager\"} |~ \"^[IWEF][0-9]{4}[[:space:]]+\""

        stage.regex {
          expression = "^(?P<level>[IWEF])"
        }

        stage.replace {
          source     = "level"
          expression = "^(I)$"
          replace    = "info"
        }

        stage.replace {
          source     = "level"
          expression = "^(W)$"
          replace    = "warn"
        }

        stage.replace {
          source     = "level"
          expression = "^(E)$"
          replace    = "error"
        }

        stage.replace {
          source     = "level"
          expression = "^(F)$"
          replace    = "fatal"
        }

        stage.labels {
          values = {
            level = "",
          }
        }
      }

  annotationAutodiscovery:
    enabled: true
    collector: alloy-metrics

  telemetryServices:
    kube-state-metrics:
      deploy: true
    node-exporter:
      deploy: true

  selfReporting:
    enabled: false
