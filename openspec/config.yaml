schema: spec-driven

context: |
  This repository declaratively manages a personal homelab.

  Structure and technology:
  - `nix/` defines NixOS and Home Manager configuration through a Nix flake, den, and import-tree. Hosts are declared in `nix/hosts/hosts.nix`; host-specific configuration lives in `nix/hosts/<host>/`, and reusable aspects/modules live in `nix/modules/`.
  - `infrastructure/` provisions underlying infrastructure, including Talos cluster resources.
  - `kubernetes/` contains Talos configuration plus GitOps-managed Kubernetes applications. Argo CD is bootstrapped from `kubernetes/clusters/home-argo/`; its root application discovers local Helm charts in `kubernetes/infrastructure/` and `kubernetes/apps/`.
  - Kubernetes components are usually local Helm charts with `Chart.yaml`, `values.yaml`, optional `templates/`, and `config.json` for Argo CD application metadata. Use Kustomize only where that established layout requires it.
  - Secrets are encrypted with SOPS and age. Follow `.sops.yaml` creation rules, retain encrypted secret files, and never add plaintext credentials, tokens, private keys, or decrypted values to the repository.

  Conventions:
  - Keep infrastructure declarative and make the smallest scoped change. Do not introduce imperative/manual deployment steps when the change belongs in Nix, Talos, Helm, Kustomize, or Argo CD configuration.
  - Use idiomatic Nix and format Nix changes with `nix fmt` (the project uses nixfmt through treefmt).
  - The root `flake.nix` is generated by flake-file. Do not edit it directly; update its source declarations and regenerate it with `nix run .#write-flake` when changes are needed.
  - Validate relevant changes with `nix flake check` and the appropriate Nix, Helm, Kustomize, or Kubernetes tooling. Avoid modifying generated, vendored, or encrypted files unless the change specifically requires it.
  - Commit messages conventionally use concise scoped prefixes such as `nix:`, `k8s:`, `infra/talos:`, or `build:`.

