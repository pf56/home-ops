schema: spec-driven

context: |
  Keep OpenSpec artifacts concise and focused on the requested change.

  Treat task completion as factual: mark a task complete only after the work has been performed and verified. Distinguish local validation, deployment, runtime verification, and operator-performed work.

  When a task requires credentials, SSH or other remote access, destructive authority, or a capability unavailable inside the nono sandbox, do not claim completion or automatically widen permissions. Record the blocker and provide the operator with prerequisites, manual steps using placeholders instead of secrets, expected verification, and rollback or cancellation guidance.

  When a change modifies durable repository structure, source-of-truth boundaries, or universal workflows, review `AGENTS.md` and update it in the same change if its general guidance is inaccurate or incomplete. Do not add temporary task details or component-specific implementation notes to `AGENTS.md`.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
